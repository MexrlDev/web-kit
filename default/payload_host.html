<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Payloads</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }

    #viewport {
      position: fixed;
      inset: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      touch-action: none;
    }

    #screen {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #000;
      image-rendering: pixelated;
      transform-origin: center center;
      will-change: transform;
    }

    .ui-img, .ui-text {
      position: absolute;
      transform-origin: left top;
      will-change: transform, opacity, left, top;
    }

    .ui-img {
      pointer-events: none;
      image-rendering: pixelated;
      -webkit-user-drag: none;
      user-drag: none;
    }

    .ui-text {
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      text-shadow: 0 1px 0 rgba(0,0,0,0.8);
      pointer-events: none;
      color: white;
      white-space: nowrap;
    }

    .rgb-glow {
      position: absolute;
      z-index: 1;
      border-radius: 8px;
      filter: blur(8px) saturate(1.5);
      pointer-events: none;
      opacity: 0.95;
      background: conic-gradient(
        #ff0000,
        #ff8800,
        #ffee00,
        #88ff00,
        #00ffee,
        #0000ff,
        #8800ff,
        #ff0088,
        #ff0000
      );
      mask: radial-gradient(circle, transparent 60%, black 61%);
      -webkit-mask: radial-gradient(circle, transparent 60%, black 61%);
      animation: spin 3000ms linear infinite;
      transform-origin: center;
      display: none;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .interactive {
      pointer-events: auto !important;
      cursor: pointer;
      touch-action: manipulation;
    }
  </style>
</head>
<body>
  <div id="viewport">
    <div id="screen" aria-hidden="false"></div>
  </div>

  <script>
  (function () {
    'use strict';

    // ----- Framework (same as main menu) -----
    window.log = function () {
      console.log.apply(console, arguments);
    };

    function scriptBaseURL() {
      var cur = document.currentScript && document.currentScript.src;
      if (!cur) cur = window.location.href;
      return new URL('.', cur).href;
    }

    function resolveAsset(path) {
      return new URL(path, scriptBaseURL()).href;
    }

    function navigateTo(target) {
      var url = new URL(target, scriptBaseURL()).href;
      window.location.href = url;
    }

    function include(path) {
      var p = path;
      if (!/\.[a-z0-9]+$/i.test(p)) p = p + '.html';
      if (/\.js$/i.test(p)) p = p.replace(/\.js$/i, '.html');
      var resolved = new URL(p, scriptBaseURL()).href;

      return fetch(resolved).then(function (r) {
        if (!r.ok) throw new Error('Failed to fetch ' + resolved + ' (' + r.status + ')');
        return r.text();
      }).then(function (text) {
        (0, eval)(text);
        return true;
      });
    }

    var screen = document.getElementById('screen');

    function updateScale() {
      var designW = 1920;
      var designH = 1080;
      var availableW = window.innerWidth;
      var availableH = window.innerHeight;
      var scale = Math.min(availableW / designW, availableH / designH);
      screen.style.transform = 'translate(-50%, -50%) scale(' + scale + ')';
    }

    window.addEventListener('resize', updateScale);
    window.addEventListener('orientationchange', updateScale);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', updateScale);
    }

    function wirePress(node, handler) {
      var lastPressAt = 0;
      function fire(ev) {
        var now = Date.now();
        if (now - lastPressAt < 300) return;
        lastPressAt = now;

        if (ev && ev.preventDefault) ev.preventDefault();
        if (ev && ev.stopPropagation) ev.stopPropagation();

        startBgmIfEnabled();
        handler(ev);
      }

      node.addEventListener('pointerup', fire, { passive: false });
      node.addEventListener('touchend', fire, { passive: false });
      node.addEventListener('click', fire, { passive: false });
    }

    function updateNodeFromObj(node, obj) {
      node.style.display = (obj.visible === false) ? 'none' : 'block';
      node.style.opacity = (typeof obj.alpha === 'number') ? obj.alpha : '1';

      var x = (typeof obj.x === 'number') ? obj.x : 0;
      var y = (typeof obj.y === 'number') ? obj.y : 0;
      var w = (typeof obj.width === 'number') ? obj.width : (node.naturalWidth || 0);
      var h = (typeof obj.height === 'number') ? obj.height : (node.naturalHeight || 0);
      var sx = (typeof obj.scaleX === 'number') ? obj.scaleX : 1;
      var sy = (typeof obj.scaleY === 'number') ? obj.scaleY : sx;

      node.style.left = x + 'px';
      node.style.top = y + 'px';
      node.style.width = w + 'px';
      node.style.height = h + 'px';
      node.style.transform = 'scale(' + sx + ',' + sy + ')';

      if (obj.borderWidth && obj.borderColor) {
        node.style.border = obj.borderWidth + 'px solid ' + obj.borderColor;
        node.style.boxSizing = 'border-box';
      } else {
        node.style.border = 'none';
      }

      if (node._glow) {
        var glow = node._glow;
        var gx = x - 8;
        var gy = y - 8;
        var gw = (w * sx) + 16;
        var gh = (h * sy) + 16;
        var br = Math.max(6, Math.min(24, Math.round(Math.min(gw, gh) * 0.06)));

        glow.style.left = gx + 'px';
        glow.style.top = gy + 'px';
        glow.style.width = gw + 'px';
        glow.style.height = gh + 'px';
        glow.style.borderRadius = br + 'px';
        glow.style.display = (obj.__glowVisible) ? 'block' : 'none';
        glow.style.opacity = (obj._glowOpacity !== undefined) ? obj._glowOpacity : 0.95;
      }
    }

    function createImageNode(obj) {
      var wrapperGlow = document.createElement('div');
      wrapperGlow.className = 'rgb-glow';
      wrapperGlow.style.display = 'none';
      screen.appendChild(wrapperGlow);

      var img = document.createElement('img');
      img.className = 'ui-img';
      img.style.position = 'absolute';
      img.draggable = false;
      img.style.pointerEvents = obj.interactive ? 'auto' : 'none';
      if (obj.interactive) img.classList.add('interactive');
      if (obj.url) img.src = obj.url;

      updateNodeFromObj(img, obj);
      img._glow = wrapperGlow;
      screen.appendChild(img);
      img.style.zIndex = 2;
      wrapperGlow.style.zIndex = 1;

      if (obj.interactive && typeof obj.onPress === 'function') {
        wirePress(img, obj.onPress);
      }

      return img;
    }

    function createTextNode(obj) {
      var div = document.createElement('div');
      div.className = 'ui-text';
      div.style.pointerEvents = 'none';
      div.style.whiteSpace = 'nowrap';
      updateNodeFromObj(div, obj);
      if (obj.text) div.textContent = obj.text;
      div.style.zIndex = 3;
      screen.appendChild(div);
      return div;
    }

    window.Image = function (opts) {
      opts = opts || {};
      var obj = {
        url: opts.url || '',
        x: opts.x || 0,
        y: opts.y || 0,
        width: opts.width || (opts.url ? 100 : 0),
        height: opts.height || (opts.url ? 100 : 0),
        visible: (typeof opts.visible === 'boolean') ? opts.visible : true,
        scaleX: 1,
        scaleY: 1,
        alpha: 1,
        borderColor: opts.borderColor || 'transparent',
        borderWidth: opts.borderWidth || 0,
        __glowVisible: false,
        interactive: !!opts.interactive,
        onPress: opts.onPress || null
      };

      var node = createImageNode(obj);
      obj._node = node;

      Object.defineProperty(obj, 'url', { get: function () { return node.src; }, set: function (v) { node.src = v; } });
      Object.defineProperty(obj, 'x', { get: function () { return parseFloat(node.style.left) || 0; }, set: function (v) { node.style.left = v + 'px'; } });
      Object.defineProperty(obj, 'y', { get: function () { return parseFloat(node.style.top) || 0; }, set: function (v) { node.style.top = v + 'px'; } });
      Object.defineProperty(obj, 'width', { get: function () { return parseFloat(node.style.width) || 0; }, set: function (v) { node.style.width = v + 'px'; } });
      Object.defineProperty(obj, 'height', { get: function () { return parseFloat(node.style.height) || 0; }, set: function (v) { node.style.height = v + 'px'; } });
      Object.defineProperty(obj, 'visible', { get: function () { return node.style.display !== 'none'; }, set: function (v) { node.style.display = v ? 'block' : 'none'; } });
      Object.defineProperty(obj, 'scaleX', { get: function () { return obj._scaleX || 1; }, set: function (v) { obj._scaleX = v; updateNodeFromObj(node, obj); } });
      Object.defineProperty(obj, 'scaleY', { get: function () { return obj._scaleY || 1; }, set: function (v) { obj._scaleY = v; updateNodeFromObj(node, obj); } });
      Object.defineProperty(obj, 'alpha', { get: function () { return parseFloat(node.style.opacity) || 1; }, set: function (v) { node.style.opacity = v; } });
      Object.defineProperty(obj, 'borderColor', { get: function () { return node.style.borderColor || 'transparent'; }, set: function (v) { node.style.borderColor = v; updateNodeFromObj(node, obj); } });
      Object.defineProperty(obj, 'borderWidth', { get: function () { return parseFloat(node.style.borderWidth) || 0; }, set: function (v) { node.style.borderWidth = v; updateNodeFromObj(node, obj); } });
      Object.defineProperty(obj, '__glowVisible', {
        get: function () { return obj.__glowVisibleFlag || false; },
        set: function (v) { obj.__glowVisibleFlag = v; obj._node._glowVisible = v; updateNodeFromObj(node, obj); }
      });

      screen.appendChild(node);
      return obj;
    };

    window.jsmaf = {
      root: { children: [] },
      setInterval: function (fn, t) { return window.setInterval(fn, t); },
      clearInterval: function (id) { window.clearInterval(id); },
      onKeyDown: null,
      setTimeout: window.setTimeout,
      circleIsAdvanceButton: false,
      XMLHttpRequest: window.XMLHttpRequest
    };

    jsmaf.Text = function () {
      var obj = { text: '', x: 0, y: 0, style: 'white', scaleX: 1, scaleY: 1 };
      var node = createTextNode(obj);
      obj._node = node;

      Object.defineProperty(obj, 'text', { get: function () { return node.textContent; }, set: function (v) { node.textContent = v; } });
      Object.defineProperty(obj, 'x', { get: function () { return parseFloat(node.style.left) || 0; }, set: function (v) { node.style.left = v + 'px'; } });
      Object.defineProperty(obj, 'y', { get: function () { return parseFloat(node.style.top) || 0; }, set: function (v) { node.style.top = v + 'px'; } });
      Object.defineProperty(obj, 'scaleX', {
        get: function () { return obj._scaleX || 1; },
        set: function (v) {
          obj._scaleX = v;
          obj._node.style.transform = 'scale(' + v + ',' + (obj._scaleY || v) + ')';
        }
      });
      Object.defineProperty(obj, 'scaleY', {
        get: function () { return obj._scaleY || 1; },
        set: function (v) {
          obj._scaleY = v;
          obj._node.style.transform = 'scale(' + (obj._scaleX || v) + ',' + v + ')';
        }
      });
      Object.defineProperty(obj, 'style', {
        set: function (v) {
          if (v === 'white') {
            obj._node.style.color = 'white';
            obj._node.style.fontSize = '24px';
          } else if (v === 'title') {
            obj._node.style.color = 'white';
            obj._node.style.fontSize = '32px';
          }
        }
      });

      screen.appendChild(node);
      return obj;
    };

    function Style(opts) {
      window.__styles__ = window.__styles__ || {};
      window.__styles__[opts.name] = opts;
    }

    // Asset base URLs
    var baseImg = resolveAsset('./img/');
    var useImageText = false;
    var textImageBase = baseImg + 'text_';

    // ----- Background Music -----
    var bgm = new Audio('https://raw.githubusercontent.com/MexrlDev/web-kit/refs/heads/main/default/music/bgm.mp3');
    bgm.loop = true;
    bgm.preload = 'auto';
    bgm.volume = 0.5;
    bgm.playsInline = true;

    var bgmStarted = false;
    function startBgmIfEnabled() {
      if (bgmStarted) return;
      bgmStarted = true;
      var attempt = bgm.play();
      if (attempt && typeof attempt.catch === 'function') {
        attempt.catch(function () {
          bgmStarted = false;
        });
      }
    }

    function stopBgm() {
      try { bgm.pause(); bgm.currentTime = 0; bgmStarted = false; } catch (e) {}
    }

    ['pointerdown', 'touchstart', 'keydown'].forEach(function (evt) {
      window.addEventListener(evt, startBgmIfEnabled, { passive: true });
    });
    window.addEventListener('beforeunload', stopBgm);
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) startBgmIfEnabled();
    });

    // ----- Language simulation -----
    var lang = {
      payloadMenu: 'Payloads'
    };

    // Simulate jailbreak status (true for extra paths demo)
    var is_jailbroken = true;

    // Simulated payload file list (replace with real fetch if needed)
    // In a real scenario you'd fetch a directory listing or use a manifest.
    var fileList = [
      { name: 'goldhen.elf', path: '/download0/payloads/goldhen.elf' },
      { name: 'ps4debug.bin', path: '/download0/payloads/ps4debug.bin' },
      { name: 'ftp.js', path: '/download0/payloads/ftp.js' },
      { name: 'hen.elf', path: '/data/payloads/hen.elf' },
      { name: 'linux_loader.elf', path: '/mnt/usb0/payloads/linux_loader.elf' },
      { name: 'orbis toolbox.bin', path: '/download0/payloads/orbis_toolbox.bin' },
      { name: 'webrte.js', path: '/download0/payloads/webrte.js' },
      { name: 'dump_sysmodules.elf', path: '/download0/payloads/dump_sysmodules.elf' }
    ];

    // Clear previous UI
    jsmaf.root.children.length = 0;

    new Style({ name: 'white', color: 'white', size: 24 });
    new Style({ name: 'title', color: 'white', size: 32 });

    // Background
    var background = new Image({
      url: baseImg + 'multiview_bg_VAF.png',
      x: 0, y: 0, width: 1920, height: 1080
    });
    jsmaf.root.children.push(background);

    // Logo (top right)
    var logo = new Image({
      url: baseImg + 'logo.png',
      x: 1620, y: 0, width: 300, height: 169
    });
    jsmaf.root.children.push(logo);

    // Title
    if (useImageText) {
      var title = new Image({
        url: textImageBase + 'payloadMenu.png',
        x: 830, y: 100, width: 250, height: 60
      });
      jsmaf.root.children.push(title);
    } else {
      var titleText = new jsmaf.Text();
      titleText.text = lang.payloadMenu;
      titleText.x = 880;
      titleText.y = 120;
      titleText.style = 'title';
      jsmaf.root.children.push(titleText);
    }

    // ----- Create UI for payloads (grid layout) -----
    var currentButton = 0;
    var buttons = [];
    var buttonTexts = [];
    var buttonMarkers = [];
    var buttonOrigPos = [];
    var textOrigPos = [];

    var normalButtonImg = baseImg + 'button_over_9.png';
    var selectedButtonImg = baseImg + 'button_over_9.png';

    var startY = 200;
    var buttonSpacing = 90;
    var buttonsPerRow = 5;
    var buttonWidth = 300;
    var buttonHeight = 80;
    var startX = 130;
    var xSpacing = 340;

    for (var i = 0; i < fileList.length; i++) {
      var row = Math.floor(i / buttonsPerRow);
      var col = i % buttonsPerRow;
      var displayName = fileList[i].name;
      var btnX = startX + col * xSpacing;
      var btnY = startY + row * buttonSpacing;

      // Button image
      var button = new Image({
        url: normalButtonImg,
        x: btnX, y: btnY, width: buttonWidth, height: buttonHeight,
        interactive: true,
        onPress: (function(idx) {
          return function() {
            currentButton = idx;
            updateHighlight();
            handleButtonPress();
          };
        })(i)
      });
      buttons.push(button);
      jsmaf.root.children.push(button);

      // Marker (glow indicator)
      var marker = new Image({
        url: baseImg + 'ad_pod_marker.png',
        x: btnX + buttonWidth - 50,
        y: btnY + 35,
        width: 12,
        height: 12,
        visible: false
      });
      buttonMarkers.push(marker);
      jsmaf.root.children.push(marker);

      // Truncate long names
      if (displayName.length > 30) {
        displayName = displayName.substring(0, 27) + '...';
      }

      var text = new jsmaf.Text();
      text.text = displayName;
      text.x = btnX + 20;
      text.y = btnY + 30;
      text.style = 'white';
      buttonTexts.push(text);
      jsmaf.root.children.push(text);

      buttonOrigPos.push({ x: btnX, y: btnY });
      textOrigPos.push({ x: text.x, y: text.y });
    }

    // Back hint
    var backHint = new jsmaf.Text();
    backHint.text = jsmaf.circleIsAdvanceButton ? 'X to go back' : 'O to go back';
    backHint.x = 890;
    backHint.y = 1000;
    backHint.style = 'white';
    jsmaf.root.children.push(backHint);

    // Animation helpers
    var zoomInInterval = null;
    var zoomOutInterval = null;
    var prevButton = -1;

    function easeInOut(t) {
      return (1 - Math.cos(t * Math.PI)) / 2;
    }

    function animateZoomIn(btn, text, btnOrigX, btnOrigY, textOrigX, textOrigY) {
      if (zoomInInterval) jsmaf.clearInterval(zoomInInterval);
      var btnW = buttonWidth;
      var btnH = buttonHeight;
      var startScale = btn.scaleX || 1.0;
      var endScale = 1.1;
      var duration = 175;
      var elapsed = 0;
      var step = 16;
      zoomInInterval = jsmaf.setInterval(function () {
        elapsed += step;
        var t = Math.min(elapsed / duration, 1);
        var eased = easeInOut(t);
        var scale = startScale + (endScale - startScale) * eased;
        btn.scaleX = scale;
        btn.scaleY = scale;
        btn.x = btnOrigX - btnW * (scale - 1) / 2;
        btn.y = btnOrigY - btnH * (scale - 1) / 2;
        text.scaleX = scale;
        text.scaleY = scale;
        text.x = textOrigX - btnW * (scale - 1) / 2;
        text.y = textOrigY - btnH * (scale - 1) / 2;
        if (t >= 1) {
          jsmaf.clearInterval(zoomInInterval);
          zoomInInterval = null;
        }
      }, step);
    }

    function animateZoomOut(btn, text, btnOrigX, btnOrigY, textOrigX, textOrigY) {
      if (zoomOutInterval) jsmaf.clearInterval(zoomOutInterval);
      var btnW = buttonWidth;
      var btnH = buttonHeight;
      var startScale = btn.scaleX || 1.1;
      var endScale = 1.0;
      var duration = 175;
      var elapsed = 0;
      var step = 16;
      zoomOutInterval = jsmaf.setInterval(function () {
        elapsed += step;
        var t = Math.min(elapsed / duration, 1);
        var eased = easeInOut(t);
        var scale = startScale + (endScale - startScale) * eased;
        btn.scaleX = scale;
        btn.scaleY = scale;
        btn.x = btnOrigX - btnW * (scale - 1) / 2;
        btn.y = btnOrigY - btnH * (scale - 1) / 2;
        text.scaleX = scale;
        text.scaleY = scale;
        text.x = textOrigX - btnW * (scale - 1) / 2;
        text.y = textOrigY - btnH * (scale - 1) / 2;
        if (t >= 1) {
          jsmaf.clearInterval(zoomOutInterval);
          zoomOutInterval = null;
        }
      }, step);
    }

    function updateHighlight() {
      var prevBtn = buttons[prevButton];
      var prevMarker = buttonMarkers[prevButton];
      if (prevButton >= 0 && prevButton !== currentButton && prevBtn) {
        prevBtn.url = normalButtonImg;
        prevBtn.alpha = 0.7;
        prevBtn.borderColor = 'transparent';
        prevBtn.borderWidth = 0;
        prevBtn.__glowVisible = false;
        if (prevMarker) prevMarker.visible = false;
        animateZoomOut(prevBtn, buttonTexts[prevButton], buttonOrigPos[prevButton].x, buttonOrigPos[prevButton].y, textOrigPos[prevButton].x, textOrigPos[prevButton].y);
      }

      for (var i = 0; i < buttons.length; i++) {
        var btn = buttons[i];
        var marker = buttonMarkers[i];
        var txt = buttonTexts[i];
        var origBtn = buttonOrigPos[i];
        var origTxt = textOrigPos[i];
        if (!btn || !txt) continue;

        if (i === currentButton) {
          btn.url = selectedButtonImg;
          btn.alpha = 1.0;
          btn.borderColor = 'rgb(100,180,255)';
          btn.borderWidth = 3;
          btn.__glowVisible = true;
          if (marker) marker.visible = true;
          animateZoomIn(btn, txt, origBtn.x, origBtn.y, origTxt.x, origTxt.y);
        } else if (i !== prevButton) {
          btn.url = normalButtonImg;
          btn.alpha = 0.7;
          btn.borderColor = 'transparent';
          btn.borderWidth = 0;
          btn.__glowVisible = false;
          btn.scaleX = 1.0; btn.scaleY = 1.0;
          btn.x = origBtn.x; btn.y = origBtn.y;
          txt.scaleX = 1.0; txt.scaleY = 1.0;
          txt.x = origTxt.x; txt.y = origTxt.y;
          if (marker) marker.visible = false;
        }
      }
      prevButton = currentButton;
    }

    // ----- Payload execution simulation -----
    function handleButtonPress() {
      if (currentButton >= fileList.length) return;
      var entry = fileList[currentButton];
      var fileName = entry.name;
      var filePath = entry.path;

      log('Selected: ' + fileName + ' from ' + filePath);

      // Simulate loading based on extension
      if (fileName.toLowerCase().endsWith('.js')) {
        // For demo, we'll fetch and eval (if file exists) or just log.
        // In a real environment you'd have actual JS payloads.
        log('Attempting to load JavaScript payload: ' + fileName);
        // Example: try to include from payloads folder (you can place actual .js files there)
        include('payloads/' + fileName).catch(function(e) {
          log('ERROR: Could not load JS payload: ' + e.message);
        });
      } else {
        // .elf / .bin simulation
        log('Loading binloader simulation for: ' + fileName);
        log('(In a real environment, this would load the binary payload)');
        alert('Simulated loading of ' + fileName + '\n(No actual execution in browser)');
      }
    }

    // ----- Keyboard navigation (grid aware) -----
    var confirmKey = jsmaf.circleIsAdvanceButton ? 13 : 14;
    var backKey = jsmaf.circleIsAdvanceButton ? 14 : 13;

    jsmaf.onKeyDown = function (keyCode) {
      log('Key pressed: ' + keyCode);
      var total = fileList.length;

      // 6 = down, 4 = up, 5 = right, 7 = left
      if (keyCode === 6) { // down
        var next = currentButton + buttonsPerRow;
        if (next < total) {
          currentButton = next;
          updateHighlight();
        }
      } else if (keyCode === 4) { // up
        var prev = currentButton - buttonsPerRow;
        if (prev >= 0) {
          currentButton = prev;
          updateHighlight();
        }
      } else if (keyCode === 5) { // right
        var nextRight = currentButton + 1;
        var currentRow = Math.floor(currentButton / buttonsPerRow);
        var nextRow = Math.floor(nextRight / buttonsPerRow);
        if (nextRight < total && nextRow === currentRow) {
          currentButton = nextRight;
          updateHighlight();
        }
      } else if (keyCode === 7) { // left
        var col = currentButton % buttonsPerRow;
        if (col > 0) {
          currentButton = currentButton - 1;
          updateHighlight();
        }
      } else if (keyCode === confirmKey) {
        handleButtonPress();
      } else if (keyCode === backKey) {
        log('Going back to main menu...');
        navigateTo('index.html'); // Adjust to your main menu file
      }
    };

    // Map physical keyboard arrows to virtual key codes for easier testing
    window.addEventListener('keydown', function(e) {
      var key = e.key;
      if (key === 'ArrowDown') jsmaf.onKeyDown(6);
      else if (key === 'ArrowUp') jsmaf.onKeyDown(4);
      else if (key === 'ArrowRight') jsmaf.onKeyDown(5);
      else if (key === 'ArrowLeft') jsmaf.onKeyDown(7);
      else if (key === 'Enter') jsmaf.onKeyDown(confirmKey);
      else if (key === 'Escape') jsmaf.onKeyDown(backKey);
      e.preventDefault();
    });

    // Initialize
    updateScale();
    updateHighlight();
    startBgmIfEnabled();
    log('Payload menu ready. Found ' + fileList.length + ' payloads.');
  })();
  </script>
</body>
