<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>config_ui</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }

    #viewport {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #000;
      touch-action: none;
    }

    #screen {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #000;
      image-rendering: pixelated;
      transform-origin: center center;
      will-change: transform;
    }

    .ui-img, .ui-text {
      position: absolute;
      transform-origin: left top;
      will-change: transform, opacity, left, top;
    }

    .ui-img {
      pointer-events: none;
      image-rendering: pixelated;
      -webkit-user-drag: none;
      user-drag: none;
    }

    .ui-text {
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      text-shadow: 0 1px 0 rgba(0,0,0,0.8);
      pointer-events: none;
      color: white;
      white-space: nowrap;
    }

    .rgb-glow {
      position: absolute;
      z-index: 1;
      border-radius: 8px;
      filter: blur(8px) saturate(1.5);
      pointer-events: none;
      opacity: 0.95;
      background: conic-gradient(#ff0000,#ff8800,#ffee00,#88ff00,#00ffee,#0000ff,#8800ff,#ff0088,#ff0000);
      mask: radial-gradient(circle, transparent 60%, black 61%);
      -webkit-mask: radial-gradient(circle, transparent 60%, black 61%);
      animation: spin 3000ms linear infinite;
      transform-origin: center;
      display: none;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .interactive {
      pointer-events: auto !important;
      cursor: pointer;
      touch-action: manipulation;
    }
  </style>
</head>
<body>
  <div id="viewport">
    <div id="screen" aria-hidden="false"></div>
  </div>

  <script>
  (function () {
    'use strict';

    function scriptBaseURL() {
      var cur = document.currentScript && document.currentScript.src;
      if (!cur) cur = window.location.href;
      return new URL('.', cur).href;
    }

    function resolveAsset(path) {
      return new URL(path, scriptBaseURL()).href;
    }

    function navigateTo(target) {
      window.location.href = new URL(target, scriptBaseURL()).href;
    }

    window.log = function () {
      console.log.apply(console, arguments);
    };

    var screen = document.getElementById('screen');

    function updateScale() {
      var designW = 1920;
      var designH = 1080;
      var availableW = window.innerWidth;
      var availableH = window.innerHeight;
      var scale = Math.min(availableW / designW, availableH / designH);
      screen.style.transform = 'translate(-50%, -50%) scale(' + scale + ')';
    }

    window.addEventListener('resize', updateScale);
    window.addEventListener('orientationchange', updateScale);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', updateScale);
    }

    function wirePress(node, handler) {
      var lastPressAt = 0;
      function fire(ev) {
        var now = Date.now();
        if (now - lastPressAt < 250) return;
        lastPressAt = now;

        if (ev && ev.preventDefault) ev.preventDefault();
        if (ev && ev.stopPropagation) ev.stopPropagation();

        handler(ev);
      }

      node.addEventListener('pointerup', fire, { passive: false });
      node.addEventListener('touchend', fire, { passive: false });
      node.addEventListener('click', fire, { passive: false });
    }

    function updateNodeFromObj(node, obj) {
      node.style.display = (obj.visible === false) ? 'none' : 'block';
      node.style.opacity = (typeof obj.alpha === 'number') ? obj.alpha : '1';

      var x = (typeof obj.x === 'number') ? obj.x : 0;
      var y = (typeof obj.y === 'number') ? obj.y : 0;
      var w = (typeof obj.width === 'number') ? obj.width : (node.naturalWidth || 0);
      var h = (typeof obj.height === 'number') ? obj.height : (node.naturalHeight || 0);
      var sx = (typeof obj.scaleX === 'number') ? obj.scaleX : 1;
      var sy = (typeof obj.scaleY === 'number') ? obj.scaleY : sx;

      node.style.left = x + 'px';
      node.style.top = y + 'px';
      node.style.width = w + 'px';
      node.style.height = h + 'px';
      node.style.transform = 'scale(' + sx + ',' + sy + ')';

      if (obj.borderWidth && obj.borderColor) {
        node.style.border = obj.borderWidth + 'px solid ' + obj.borderColor;
        node.style.boxSizing = 'border-box';
      } else {
        node.style.border = 'none';
      }

      if (node._glow) {
        var glow = node._glow;
        var gx = x - 8;
        var gy = y - 8;
        var gw = (w * sx) + 16;
        var gh = (h * sy) + 16;
        var br = Math.max(6, Math.min(24, Math.round(Math.min(gw, gh) * 0.06)));

        glow.style.left = gx + 'px';
        glow.style.top = gy + 'px';
        glow.style.width = gw + 'px';
        glow.style.height = gh + 'px';
        glow.style.borderRadius = br + 'px';
        glow.style.display = (obj.__glowVisible) ? 'block' : 'none';
        glow.style.opacity = (obj._glowOpacity !== undefined) ? obj._glowOpacity : 0.95;
      }
    }

    function createImageNode(obj) {
      var wrapperGlow = document.createElement('div');
      wrapperGlow.className = 'rgb-glow';
      wrapperGlow.style.display = 'none';
      screen.appendChild(wrapperGlow);

      var img = document.createElement('img');
      img.className = 'ui-img';
      img.style.position = 'absolute';
      img.draggable = false;
      img.style.pointerEvents = obj.interactive ? 'auto' : 'none';
      if (obj.interactive) img.classList.add('interactive');
      if (obj.url) img.src = obj.url;

      updateNodeFromObj(img, obj);
      img._glow = wrapperGlow;
      screen.appendChild(img);
      img.style.zIndex = 2;
      wrapperGlow.style.zIndex = 1;

      if (obj.interactive && typeof obj.onPress === 'function') {
        wirePress(img, obj.onPress);
      }

      return img;
    }

    function createTextNode(obj) {
      var div = document.createElement('div');
      div.className = 'ui-text';
      div.style.whiteSpace = 'nowrap';
      div.style.pointerEvents = 'none';
      updateNodeFromObj(div, obj);
      if (obj.text) div.textContent = obj.text;
      div.style.zIndex = 3;
      screen.appendChild(div);
      return div;
    }

    window.Image = function (opts) {
      opts = opts || {};
      var obj = {
        url: opts.url || '',
        x: opts.x || 0,
        y: opts.y || 0,
        width: opts.width || (opts.url ? 100 : 0),
        height: opts.height || (opts.url ? 100 : 0),
        visible: (typeof opts.visible === 'boolean') ? opts.visible : true,
        scaleX: 1,
        scaleY: 1,
        alpha: 1,
        borderColor: opts.borderColor || 'transparent',
        borderWidth: opts.borderWidth || 0,
        __glowVisible: false,
        interactive: !!opts.interactive,
        onPress: opts.onPress || null
      };

      var node = createImageNode(obj);
      obj._node = node;

      Object.defineProperty(obj, 'url', { get: function () { return node.src; }, set: function (v) { node.src = v; } });
      Object.defineProperty(obj, 'x', { get: function () { return parseFloat(node.style.left) || 0; }, set: function (v) { node.style.left = v + 'px'; } });
      Object.defineProperty(obj, 'y', { get: function () { return parseFloat(node.style.top) || 0; }, set: function (v) { node.style.top = v + 'px'; } });
      Object.defineProperty(obj, 'width', { get: function () { return parseFloat(node.style.width) || 0; }, set: function (v) { node.style.width = v + 'px'; } });
      Object.defineProperty(obj, 'height', { get: function () { return parseFloat(node.style.height) || 0; }, set: function (v) { node.style.height = v + 'px'; } });
      Object.defineProperty(obj, 'visible', { get: function () { return node.style.display !== 'none'; }, set: function (v) { node.style.display = v ? 'block' : 'none'; } });
      Object.defineProperty(obj, 'scaleX', { get: function () { return obj._scaleX || 1; }, set: function (v) { obj._scaleX = v; updateNodeFromObj(node, obj); } });
      Object.defineProperty(obj, 'scaleY', { get: function () { return obj._scaleY || 1; }, set: function (v) { obj._scaleY = v; updateNodeFromObj(node, obj); } });
      Object.defineProperty(obj, 'alpha', { get: function () { return parseFloat(node.style.opacity) || 1; }, set: function (v) { node.style.opacity = v; } });
      Object.defineProperty(obj, 'borderColor', { get: function () { return node.style.borderColor || 'transparent'; }, set: function (v) { node.style.borderColor = v; updateNodeFromObj(node, obj); } });
      Object.defineProperty(obj, 'borderWidth', { get: function () { return parseFloat(node.style.borderWidth) || 0; }, set: function (v) { node.style.borderWidth = v; updateNodeFromObj(node, obj); } });
      Object.defineProperty(obj, '__glowVisible', {
        get: function () { return obj.__glowVisibleFlag || false; },
        set: function (v) { obj.__glowVisibleFlag = v; obj._node._glowVisible = v; updateNodeFromObj(node, obj); }
      });

      screen.appendChild(node);
      return obj;
    };

    window.jsmaf = {
      root: { children: [] },
      setInterval: function (fn, t) { return window.setInterval(fn, t); },
      clearInterval: function (id) { window.clearInterval(id); },
      setTimeout: window.setTimeout,
      onKeyDown: null,
      circleIsAdvanceButton: false,
      XMLHttpRequest: window.XMLHttpRequest
    };

    jsmaf.Text = function () {
      var obj = { text: '', x: 0, y: 0, style: 'white', scaleX: 1, scaleY: 1 };
      var node = createTextNode(obj);
      obj._node = node;

      Object.defineProperty(obj, 'text', { get: function () { return node.textContent; }, set: function (v) { node.textContent = v; } });
      Object.defineProperty(obj, 'x', { get: function () { return parseFloat(node.style.left) || 0; }, set: function (v) { node.style.left = v + 'px'; } });
      Object.defineProperty(obj, 'y', { get: function () { return parseFloat(node.style.top) || 0; }, set: function (v) { node.style.top = v + 'px'; } });
      Object.defineProperty(obj, 'scaleX', {
        get: function () { return obj._scaleX || 1; },
        set: function (v) {
          obj._scaleX = v;
          obj._node.style.transform = 'scale(' + v + ',' + (obj._scaleY || v) + ')';
        }
      });
      Object.defineProperty(obj, 'scaleY', {
        get: function () { return obj._scaleY || 1; },
        set: function (v) {
          obj._scaleY = v;
          obj._node.style.transform = 'scale(' + (obj._scaleX || v) + ',' + v + ')';
        }
      });
      Object.defineProperty(obj, 'style', {
        set: function (v) {
          if (v === 'white') {
            obj._node.style.color = 'white';
            obj._node.style.fontSize = '24px';
          } else if (v === 'title') {
            obj._node.style.color = 'white';
            obj._node.style.fontSize = '34px';
            obj._node.style.fontWeight = '700';
          }
        }
      });

      screen.appendChild(node);
      return obj;
    };

    function Style(opts) {
      window.__styles__ = window.__styles__ || {};
      window.__styles__[opts.name] = opts;
    }

    function makeFallbackConfig() {
      return {
        autolapse: false,
        autopoop: false,
        autoclose: false,
        music: true,
        jb_behavior: 0,
        theme: 'default'
      };
    }

    var STORAGE_KEY = 'web-kit-config';

    function loadConfig() {
      var cfg = makeFallbackConfig();
      try {
        var raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          var parsed = JSON.parse(raw);
          if (parsed && typeof parsed === 'object') {
            if (typeof parsed.autolapse === 'boolean') cfg.autolapse = parsed.autolapse;
            if (typeof parsed.autopoop === 'boolean') cfg.autopoop = parsed.autopoop;
            if (typeof parsed.autoclose === 'boolean') cfg.autoclose = parsed.autoclose;
            if (typeof parsed.music === 'boolean') cfg.music = parsed.music;
            if (typeof parsed.jb_behavior === 'number') cfg.jb_behavior = parsed.jb_behavior;
            if (typeof parsed.theme === 'string') cfg.theme = parsed.theme;
          }
        }
      } catch (e) {}
      return cfg;
    }

    function saveConfig(cfg) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(cfg));
      } catch (e) {}
    }

    var config = loadConfig();

    var baseImg = resolveAsset('./img/');
    var normalButtonImg = baseImg + 'button_over_9.png';
    var selectedButtonImg = baseImg + 'button_over_9.png';

    var titleLogo = new Image({
      url: baseImg + 'logo.png',
      x: 960 - 300,
      y: 30,
      width: 600,
      height: 338
    });
    jsmaf.root.children.push(titleLogo);

    var title = new jsmaf.Text();
    title.text = 'Config';
    title.x = 905;
    title.y = 120;
    title.style = 'title';
    jsmaf.root.children.push(title);

    var subtitle = new jsmaf.Text();
    subtitle.text = 'Tap a setting to change it';
    subtitle.x = 810;
    subtitle.y = 175;
    subtitle.style = 'white';
    jsmaf.root.children.push(subtitle);

    var options = [
      {
        key: 'autolapse',
        label: 'Auto Lapse',
        type: 'toggle'
      },
      {
        key: 'autopoop',
        label: 'Auto Poop',
        type: 'toggle'
      },
      {
        key: 'autoclose',
        label: 'Auto Close',
        type: 'toggle'
      },
      {
        key: 'music',
        label: 'Music',
        type: 'toggle'
      },
      {
        key: 'jb_behavior',
        label: 'JB Behavior',
        type: 'cycle',
        values: ['Auto', 'Netctrl', 'Lapse']
      },
      {
        key: 'theme',
        label: 'Theme',
        type: 'cycle',
        values: ['default', 'dark', 'neon']
      }
    ];

    var buttons = [];
    var labels = [];
    var values = [];
    var buttonOrigPos = [];
    var labelOrigPos = [];
    var valueOrigPos = [];

    var currentButton = 0;
    var prevButton = -1;
    var buttonWidth = 720;
    var buttonHeight = 84;
    var startY = 240;
    var spacing = 106;

    function createButtonRow(index) {
      var opt = options[index];
      var x = 960 - buttonWidth / 2;
      var y = startY + index * spacing;

      var btn = new Image({
        url: normalButtonImg,
        x: x,
        y: y,
        width: buttonWidth,
        height: buttonHeight,
        interactive: true,
        onPress: function () {
          currentButton = index;
          updateHighlight();
          handleButtonPress();
        }
      });
      buttons.push(btn);
      jsmaf.root.children.push(btn);

      var label = new jsmaf.Text();
      label.text = opt.label;
      label.x = x + 30;
      label.y = y + 28;
      label.style = 'white';
      labels.push(label);
      jsmaf.root.children.push(label);

      var value = new jsmaf.Text();
      value.style = 'white';
      value.x = x + 450;
      value.y = y + 28;
      values.push(value);
      jsmaf.root.children.push(value);

      buttonOrigPos.push({ x: x, y: y });
      labelOrigPos.push({ x: label.x, y: label.y });
      valueOrigPos.push({ x: value.x, y: value.y });
    }

    for (var i = 0; i < options.length; i++) createButtonRow(i);

    var backButton = new Image({
      url: normalButtonImg,
      x: 960 - 220,
      y: 850,
      width: 440,
      height: 84,
      interactive: true,
      onPress: function () {
        goBack();
      }
    });
    buttons.push(backButton);
    jsmaf.root.children.push(backButton);

    var backText = new jsmaf.Text();
    backText.text = 'Exit';
    backText.x = 960 - 40;
    backText.y = 878;
    backText.style = 'white';
    labels.push(backText);
    values.push(null);
    jsmaf.root.children.push(backText);

    buttonOrigPos.push({ x: 960 - 220, y: 850 });
    labelOrigPos.push({ x: backText.x, y: backText.y });
    valueOrigPos.push({ x: 0, y: 0 });

    function getValueText(opt) {
      if (opt.type === 'toggle') {
        return config[opt.key] ? 'ON' : 'OFF';
      }
      if (opt.key === 'jb_behavior') {
        return opt.values[config.jb_behavior] || opt.values[0];
      }
      if (opt.key === 'theme') {
        return (config.theme || 'default').toUpperCase();
      }
      return '';
    }

    function updateValue(index) {
      var opt = options[index];
      if (!opt || !values[index]) return;
      values[index].text = getValueText(opt);
      values[index].x = valueOrigPos[index].x;
      values[index].y = valueOrigPos[index].y;
    }

    function updateAllValues() {
      for (var i = 0; i < options.length; i++) updateValue(i);
    }

    function animateZoomIn(btn, textA, textB, btnOrigX, btnOrigY, textOrigXA, textOrigYA, textOrigXB, textOrigYB) {
      var btnW = buttonWidth;
      var btnH = buttonHeight;
      var startScale = btn.scaleX || 1.0;
      var endScale = 1.08;
      var duration = 160;
      var elapsed = 0;
      var step = 16;

      if (animateZoomIn._interval) jsmaf.clearInterval(animateZoomIn._interval);

      animateZoomIn._interval = jsmaf.setInterval(function () {
        elapsed += step;
        var t = Math.min(elapsed / duration, 1);
        var eased = (1 - Math.cos(t * Math.PI)) / 2;
        var scale = startScale + (endScale - startScale) * eased;

        btn.scaleX = scale;
        btn.scaleY = scale;
        btn.x = btnOrigX - btnW * (scale - 1) / 2;
        btn.y = btnOrigY - btnH * (scale - 1) / 2;

        if (textA) {
          textA.scaleX = scale;
          textA.scaleY = scale;
          textA.x = textOrigXA - btnW * (scale - 1) / 2;
          textA.y = textOrigYA - btnH * (scale - 1) / 2;
        }

        if (textB) {
          textB.scaleX = scale;
          textB.scaleY = scale;
          textB.x = textOrigXB - btnW * (scale - 1) / 2;
          textB.y = textOrigYB - btnH * (scale - 1) / 2;
        }

        if (t >= 1) {
          jsmaf.clearInterval(animateZoomIn._interval);
          animateZoomIn._interval = null;
        }
      }, step);
    }

    function animateZoomOut(btn, textA, textB, btnOrigX, btnOrigY, textOrigXA, textOrigYA, textOrigXB, textOrigYB) {
      var btnW = buttonWidth;
      var btnH = buttonHeight;
      var startScale = btn.scaleX || 1.08;
      var endScale = 1.0;
      var duration = 160;
      var elapsed = 0;
      var step = 16;

      if (animateZoomOut._interval) jsmaf.clearInterval(animateZoomOut._interval);

      animateZoomOut._interval = jsmaf.setInterval(function () {
        elapsed += step;
        var t = Math.min(elapsed / duration, 1);
        var eased = (1 - Math.cos(t * Math.PI)) / 2;
        var scale = startScale + (endScale - startScale) * eased;

        btn.scaleX = scale;
        btn.scaleY = scale;
        btn.x = btnOrigX - btnW * (scale - 1) / 2;
        btn.y = btnOrigY - btnH * (scale - 1) / 2;

        if (textA) {
          textA.scaleX = scale;
          textA.scaleY = scale;
          textA.x = textOrigXA - btnW * (scale - 1) / 2;
          textA.y = textOrigYA - btnH * (scale - 1) / 2;
        }

        if (textB) {
          textB.scaleX = scale;
          textB.scaleY = scale;
          textB.x = textOrigXB - btnW * (scale - 1) / 2;
          textB.y = textOrigYB - btnH * (scale - 1) / 2;
        }

        if (t >= 1) {
          jsmaf.clearInterval(animateZoomOut._interval);
          animateZoomOut._interval = null;
        }
      }, step);
    }

    function updateHighlight() {
      var prev = buttons[prevButton];
      if (prevButton >= 0 && prevButton !== currentButton && prev) {
        prev.url = normalButtonImg;
        prev.alpha = 0.7;
        prev.borderColor = 'transparent';
        prev.borderWidth = 0;
        animateZoomOut(
          prev,
          labels[prevButton],
          values[prevButton],
          buttonOrigPos[prevButton].x,
          buttonOrigPos[prevButton].y,
          labelOrigPos[prevButton].x,
          labelOrigPos[prevButton].y,
          valueOrigPos[prevButton].x,
          valueOrigPos[prevButton].y
        );
      }

      for (var i = 0; i < buttons.length; i++) {
        var btn = buttons[i];
        if (!btn) continue;

        if (i === currentButton) {
          btn.url = selectedButtonImg;
          btn.alpha = 1.0;
          btn.borderColor = 'rgb(100,180,255)';
          btn.borderWidth = 3;
          animateZoomIn(
            btn,
            labels[i],
            values[i],
            buttonOrigPos[i].x,
            buttonOrigPos[i].y,
            labelOrigPos[i].x,
            labelOrigPos[i].y,
            valueOrigPos[i].x,
            valueOrigPos[i].y
          );
        } else if (i !== prevButton) {
          btn.url = normalButtonImg;
          btn.alpha = 0.7;
          btn.borderColor = 'transparent';
          btn.borderWidth = 0;
          btn.scaleX = 1.0;
          btn.scaleY = 1.0;
          btn.x = buttonOrigPos[i].x;
          btn.y = buttonOrigPos[i].y;
          if (labels[i]) {
            labels[i].scaleX = 1.0;
            labels[i].scaleY = 1.0;
            labels[i].x = labelOrigPos[i].x;
            labels[i].y = labelOrigPos[i].y;
          }
          if (values[i]) {
            values[i].scaleX = 1.0;
            values[i].scaleY = 1.0;
            values[i].x = valueOrigPos[i].x;
            values[i].y = valueOrigPos[i].y;
          }
        }
      }

      prevButton = currentButton;
    }

    function cycleTheme() {
      var themeList = ['default', 'dark', 'neon'];
      var idx = themeList.indexOf(config.theme);
      if (idx < 0) idx = 0;
      config.theme = themeList[(idx + 1) % themeList.length];
    }

    function handleButtonPress() {
      var opt = options[currentButton];
      if (!opt) return;

      if (opt.type === 'toggle') {
        config[opt.key] = !config[opt.key];
      } else if (opt.type === 'cycle') {
        if (opt.key === 'jb_behavior') {
          config.jb_behavior = (config.jb_behavior + 1) % opt.values.length;
        } else if (opt.key === 'theme') {
          cycleTheme();
        }
      }

      saveConfig(config);
      updateAllValues();
      updateHighlight();
    }

    function goBack() {
      saveConfig(config);
      navigateTo('main.html');
    }

    jsmaf.onKeyDown = function (keyCode) {
      if (keyCode === 6 || keyCode === 5) {
        currentButton = (currentButton + 1) % buttons.length;
        updateHighlight();
      } else if (keyCode === 4 || keyCode === 7) {
        currentButton = (currentButton - 1 + buttons.length) % buttons.length;
        updateHighlight();
      } else if (keyCode === 14 || keyCode === 13) {
        if (currentButton === buttons.length - 1) goBack();
        else handleButtonPress();
      }
    };

    updateAllValues();
    updateScale();
    updateHighlight();

    window.addEventListener('load', function () {
      updateScale();
    });
  })();
  </script>
</body>
</html>
