<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Config</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }

    #viewport {
      position: fixed;
      inset: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      touch-action: none;
    }

    #screen {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #000;
      image-rendering: pixelated;
      transform-origin: center center;
      will-change: transform;
    }

    .ui-img, .ui-text {
      position: absolute;
      transform-origin: left top;
      will-change: transform, opacity, left, top;
    }

    .ui-img {
      pointer-events: none;
      image-rendering: pixelated;
      -webkit-user-drag: none;
      user-drag: none;
    }

    .ui-text {
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      text-shadow: 0 1px 0 rgba(0,0,0,0.8);
      pointer-events: none;
      color: white;
      white-space: nowrap;
    }

    .rgb-glow {
      position: absolute;
      z-index: 1;
      border-radius: 8px;
      filter: blur(8px) saturate(1.5);
      pointer-events: none;
      opacity: 0.95;
      background: conic-gradient(
        #ff0000,
        #ff8800,
        #ffee00,
        #88ff00,
        #00ffee,
        #0000ff,
        #8800ff,
        #ff0088,
        #ff0000
      );
      mask: radial-gradient(circle, transparent 60%, black 61%);
      -webkit-mask: radial-gradient(circle, transparent 60%, black 61%);
      animation: spin 3000ms linear infinite;
      transform-origin: center;
      display: none;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .interactive {
      pointer-events: auto !important;
      cursor: pointer;
      touch-action: manipulation;
    }
  </style>
</head>
<body>
  <div id="viewport">
    <div id="screen" aria-hidden="false"></div>
  </div>

  <script>
  (function () {
    'use strict';

    // ----- Framework (same as main menu) -----
    window.log = function () {
      console.log.apply(console, arguments);
    };

    function scriptBaseURL() {
      var cur = document.currentScript && document.currentScript.src;
      if (!cur) cur = window.location.href;
      return new URL('.', cur).href;
    }

    function resolveAsset(path) {
      return new URL(path, scriptBaseURL()).href;
    }

    function navigateTo(target) {
      var url = new URL(target, scriptBaseURL()).href;
      window.location.href = url;
    }

    function include(path) {
      var p = path;
      if (!/\.[a-z0-9]+$/i.test(p)) p = p + '.html';
      if (/\.js$/i.test(p)) p = p.replace(/\.js$/i, '.html');
      var resolved = new URL(p, scriptBaseURL()).href;

      return fetch(resolved).then(function (r) {
        if (!r.ok) throw new Error('Failed to fetch ' + resolved + ' (' + r.status + ')');
        return r.text();
      }).then(function (text) {
        (0, eval)(text);
        return true;
      });
    }

    var screen = document.getElementById('screen');

    function updateScale() {
      var designW = 1920;
      var designH = 1080;
      var availableW = window.innerWidth;
      var availableH = window.innerHeight;
      var scale = Math.min(availableW / designW, availableH / designH);
      screen.style.transform = 'translate(-50%, -50%) scale(' + scale + ')';
    }

    window.addEventListener('resize', updateScale);
    window.addEventListener('orientationchange', updateScale);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', updateScale);
    }

    function wirePress(node, handler) {
      var lastPressAt = 0;
      function fire(ev) {
        var now = Date.now();
        if (now - lastPressAt < 300) return;
        lastPressAt = now;

        if (ev && ev.preventDefault) ev.preventDefault();
        if (ev && ev.stopPropagation) ev.stopPropagation();

        startBgmIfEnabled();
        handler(ev);
      }

      node.addEventListener('pointerup', fire, { passive: false });
      node.addEventListener('touchend', fire, { passive: false });
      node.addEventListener('click', fire, { passive: false });
    }

    function updateNodeFromObj(node, obj) {
      node.style.display = (obj.visible === false) ? 'none' : 'block';
      node.style.opacity = (typeof obj.alpha === 'number') ? obj.alpha : '1';

      var x = (typeof obj.x === 'number') ? obj.x : 0;
      var y = (typeof obj.y === 'number') ? obj.y : 0;
      var w = (typeof obj.width === 'number') ? obj.width : (node.naturalWidth || 0);
      var h = (typeof obj.height === 'number') ? obj.height : (node.naturalHeight || 0);
      var sx = (typeof obj.scaleX === 'number') ? obj.scaleX : 1;
      var sy = (typeof obj.scaleY === 'number') ? obj.scaleY : sx;

      node.style.left = x + 'px';
      node.style.top = y + 'px';
      node.style.width = w + 'px';
      node.style.height = h + 'px';
      node.style.transform = 'scale(' + sx + ',' + sy + ')';

      if (obj.borderWidth && obj.borderColor) {
        node.style.border = obj.borderWidth + 'px solid ' + obj.borderColor;
        node.style.boxSizing = 'border-box';
      } else {
        node.style.border = 'none';
      }

      if (node._glow) {
        var glow = node._glow;
        var gx = x - 8;
        var gy = y - 8;
        var gw = (w * sx) + 16;
        var gh = (h * sy) + 16;
        var br = Math.max(6, Math.min(24, Math.round(Math.min(gw, gh) * 0.06)));

        glow.style.left = gx + 'px';
        glow.style.top = gy + 'px';
        glow.style.width = gw + 'px';
        glow.style.height = gh + 'px';
        glow.style.borderRadius = br + 'px';
        glow.style.display = (obj.__glowVisible) ? 'block' : 'none';
        glow.style.opacity = (obj._glowOpacity !== undefined) ? obj._glowOpacity : 0.95;
      }
    }

    function createImageNode(obj) {
      var wrapperGlow = document.createElement('div');
      wrapperGlow.className = 'rgb-glow';
      wrapperGlow.style.display = 'none';
      screen.appendChild(wrapperGlow);

      var img = document.createElement('img');
      img.className = 'ui-img';
      img.style.position = 'absolute';
      img.draggable = false;
      img.style.pointerEvents = obj.interactive ? 'auto' : 'none';
      if (obj.interactive) img.classList.add('interactive');
      if (obj.url) img.src = obj.url;

      updateNodeFromObj(img, obj);
      img._glow = wrapperGlow;
      screen.appendChild(img);
      img.style.zIndex = 2;
      wrapperGlow.style.zIndex = 1;

      if (obj.interactive && typeof obj.onPress === 'function') {
        wirePress(img, obj.onPress);
      }

      return img;
    }

    function createTextNode(obj) {
      var div = document.createElement('div');
      div.className = 'ui-text';
      div.style.pointerEvents = 'none';
      div.style.whiteSpace = 'nowrap';
      updateNodeFromObj(div, obj);
      if (obj.text) div.textContent = obj.text;
      div.style.zIndex = 3;
      screen.appendChild(div);
      return div;
    }

    window.Image = function (opts) {
      opts = opts || {};
      var obj = {
        url: opts.url || '',
        x: opts.x || 0,
        y: opts.y || 0,
        width: opts.width || (opts.url ? 100 : 0),
        height: opts.height || (opts.url ? 100 : 0),
        visible: (typeof opts.visible === 'boolean') ? opts.visible : true,
        scaleX: 1,
        scaleY: 1,
        alpha: 1,
        borderColor: opts.borderColor || 'transparent',
        borderWidth: opts.borderWidth || 0,
        __glowVisible: false,
        interactive: !!opts.interactive,
        onPress: opts.onPress || null
      };

      var node = createImageNode(obj);
      obj._node = node;

      Object.defineProperty(obj, 'url', { get: function () { return node.src; }, set: function (v) { node.src = v; } });
      Object.defineProperty(obj, 'x', { get: function () { return parseFloat(node.style.left) || 0; }, set: function (v) { node.style.left = v + 'px'; } });
      Object.defineProperty(obj, 'y', { get: function () { return parseFloat(node.style.top) || 0; }, set: function (v) { node.style.top = v + 'px'; } });
      Object.defineProperty(obj, 'width', { get: function () { return parseFloat(node.style.width) || 0; }, set: function (v) { node.style.width = v + 'px'; } });
      Object.defineProperty(obj, 'height', { get: function () { return parseFloat(node.style.height) || 0; }, set: function (v) { node.style.height = v + 'px'; } });
      Object.defineProperty(obj, 'visible', { get: function () { return node.style.display !== 'none'; }, set: function (v) { node.style.display = v ? 'block' : 'none'; } });
      Object.defineProperty(obj, 'scaleX', { get: function () { return obj._scaleX || 1; }, set: function (v) { obj._scaleX = v; updateNodeFromObj(node, obj); } });
      Object.defineProperty(obj, 'scaleY', { get: function () { return obj._scaleY || 1; }, set: function (v) { obj._scaleY = v; updateNodeFromObj(node, obj); } });
      Object.defineProperty(obj, 'alpha', { get: function () { return parseFloat(node.style.opacity) || 1; }, set: function (v) { node.style.opacity = v; } });
      Object.defineProperty(obj, 'borderColor', { get: function () { return node.style.borderColor || 'transparent'; }, set: function (v) { node.style.borderColor = v; updateNodeFromObj(node, obj); } });
      Object.defineProperty(obj, 'borderWidth', { get: function () { return parseFloat(node.style.borderWidth) || 0; }, set: function (v) { node.style.borderWidth = v; updateNodeFromObj(node, obj); } });
      Object.defineProperty(obj, '__glowVisible', {
        get: function () { return obj.__glowVisibleFlag || false; },
        set: function (v) { obj.__glowVisibleFlag = v; obj._node._glowVisible = v; updateNodeFromObj(node, obj); }
      });

      screen.appendChild(node);
      return obj;
    };

    window.jsmaf = {
      root: { children: [] },
      setInterval: function (fn, t) { return window.setInterval(fn, t); },
      clearInterval: function (id) { window.clearInterval(id); },
      onKeyDown: null,
      setTimeout: window.setTimeout,
      circleIsAdvanceButton: false,
      XMLHttpRequest: window.XMLHttpRequest
    };

    jsmaf.Text = function () {
      var obj = { text: '', x: 0, y: 0, style: 'white', scaleX: 1, scaleY: 1 };
      var node = createTextNode(obj);
      obj._node = node;

      Object.defineProperty(obj, 'text', { get: function () { return node.textContent; }, set: function (v) { node.textContent = v; } });
      Object.defineProperty(obj, 'x', { get: function () { return parseFloat(node.style.left) || 0; }, set: function (v) { node.style.left = v + 'px'; } });
      Object.defineProperty(obj, 'y', { get: function () { return parseFloat(node.style.top) || 0; }, set: function (v) { node.style.top = v + 'px'; } });
      Object.defineProperty(obj, 'scaleX', {
        get: function () { return obj._scaleX || 1; },
        set: function (v) {
          obj._scaleX = v;
          obj._node.style.transform = 'scale(' + v + ',' + (obj._scaleY || v) + ')';
        }
      });
      Object.defineProperty(obj, 'scaleY', {
        get: function () { return obj._scaleY || 1; },
        set: function (v) {
          obj._scaleY = v;
          obj._node.style.transform = 'scale(' + (obj._scaleX || v) + ',' + v + ')';
        }
      });
      Object.defineProperty(obj, 'style', {
        set: function (v) {
          if (v === 'white') {
            obj._node.style.color = 'white';
            obj._node.style.fontSize = '24px';
          } else if (v === 'title') {
            obj._node.style.color = 'white';
            obj._node.style.fontSize = '32px';
          }
        }
      });

      screen.appendChild(node);
      return obj;
    };

    function Style(opts) {
      window.__styles__ = window.__styles__ || {};
      window.__styles__[opts.name] = opts;
    }

    // Asset base URLs (adjust if needed)
    var baseImg = resolveAsset('./img/');
    var useImageText = false;
    var textImageBase = baseImg + 'text_';

    // ----- Background Music (same as main menu) -----
    var bgm = new Audio('https://raw.githubusercontent.com/MexrlDev/web-kit/refs/heads/main/default/music/bgm.mp3');
    bgm.loop = true;
    bgm.preload = 'auto';
    bgm.volume = 0.5;
    bgm.playsInline = true;

    var bgmStarted = false;
    function startBgmIfEnabled() {
      if (bgmStarted) return;
      bgmStarted = true;
      var attempt = bgm.play();
      if (attempt && typeof attempt.catch === 'function') {
        attempt.catch(function () {
          bgmStarted = false;
        });
      }
    }

    function stopBgm() {
      try { bgm.pause(); bgm.currentTime = 0; bgmStarted = false; } catch (e) {}
    }

    ['pointerdown', 'touchstart', 'keydown'].forEach(function (evt) {
      window.addEventListener(evt, startBgmIfEnabled, { passive: true });
    });
    window.addEventListener('beforeunload', stopBgm);
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && currentConfig.music) startBgmIfEnabled();
    });

    // ----- Language simulation (replace include('languages.js')) -----
    var lang = {
      loadingConfig: 'Loading configuration...',
      config: 'Settings',
      autoLapse: 'Auto Lapse',
      autoPoop: 'Auto Poop',
      autoClose: 'Auto Close',
      music: 'Music',
      jbBehavior: 'JB Behavior',
      theme: 'Theme',
      jbBehaviorAuto: 'Auto',
      jbBehaviorNetctrl: 'Netctrl',
      jbBehaviorLapse: 'Lapse',
      configLoaded: 'Configuration loaded.'
    };

    // Simulate file system with localStorage
    var fs = {
      write: function (filename, content, callback) {
        try {
          localStorage.setItem('config_' + filename, content);
          callback(null);
        } catch (e) {
          callback(e);
        }
      },
      read: function (filename, callback) {
        try {
          var data = localStorage.getItem('config_' + filename);
          callback(null, data);
        } catch (e) {
          callback(e, null);
        }
      }
    };

    // ----- Config state -----
    var currentConfig = {
      autolapse: false,
      autopoop: false,
      autoclose: false,
      autoclose_delay: 0,
      music: true,
      jb_behavior: 0,
      theme: 'default'
    };

    var userPayloads = [];
    var configLoaded = false;
    var jbBehaviorLabels = [lang.jbBehaviorAuto, lang.jbBehaviorNetctrl, lang.jbBehaviorLapse];
    var jbBehaviorImgKeys = ['jbBehaviorAuto', 'jbBehaviorNetctrl', 'jbBehaviorLapse'];

    // Simulate theme scanning (browser-friendly)
    var availableThemes = ['default', 'dark', 'light']; // could be expanded
    var themeLabels = availableThemes.map(theme => theme.charAt(0).toUpperCase() + theme.slice(1));
    var themeImgKeys = availableThemes.map(theme => 'theme' + theme.charAt(0).toUpperCase() + theme.slice(1));

    var currentButton = 0;
    var buttons = [];
    var buttonTexts = [];
    var buttonMarkers = [];
    var buttonOrigPos = [];
    var textOrigPos = [];
    var valueTexts = [];

    var normalButtonImg = baseImg + 'button_over_9.png';
    var selectedButtonImg = baseImg + 'button_over_9.png';

    // Clear root children
    jsmaf.root.children.length = 0;

    new Style({ name: 'white', color: 'white', size: 24 });
    new Style({ name: 'title', color: 'white', size: 32 });

    // Background
    var background = new Image({
      url: baseImg + 'multiview_bg_VAF.png',
      x: 0, y: 0, width: 1920, height: 1080
    });
    jsmaf.root.children.push(background);

    // Logo (top right)
    var logo = new Image({
      url: baseImg + 'logo.png',
      x: 1620, y: 0, width: 300, height: 169
    });
    jsmaf.root.children.push(logo);

    // Title
    if (useImageText) {
      var title = new Image({
        url: textImageBase + 'config.png',
        x: 860, y: 100, width: 200, height: 60
      });
      jsmaf.root.children.push(title);
    } else {
      var titleText = new jsmaf.Text();
      titleText.text = lang.config;
      titleText.x = 910;
      titleText.y = 120;
      titleText.style = 'title';
      jsmaf.root.children.push(titleText);
    }

    // Config options definition
    var configOptions = [
      { key: 'autolapse', label: lang.autoLapse, imgKey: 'autoLapse', type: 'toggle' },
      { key: 'autopoop', label: lang.autoPoop, imgKey: 'autoPoop', type: 'toggle' },
      { key: 'autoclose', label: lang.autoClose, imgKey: 'autoClose', type: 'toggle' },
      { key: 'music', label: lang.music, imgKey: 'music', type: 'toggle' },
      { key: 'jb_behavior', label: lang.jbBehavior, imgKey: 'jbBehavior', type: 'cycle' },
      { key: 'theme', label: lang.theme, imgKey: 'theme', type: 'cycle' }
    ];

    var centerX = 960;
    var startY = 200;
    var buttonSpacing = 120;
    var buttonWidth = 400;
    var buttonHeight = 80;

    // Create UI elements
    for (var i = 0; i < configOptions.length; i++) {
      var opt = configOptions[i];
      var btnX = centerX - buttonWidth / 2;
      var btnY = startY + i * buttonSpacing;

      var button = new Image({
        url: normalButtonImg,
        x: btnX, y: btnY, width: buttonWidth, height: buttonHeight,
        interactive: true,
        onPress: (function(idx) {
          return function() {
            currentButton = idx;
            updateHighlight();
            handleButtonPress();
          };
        })(i)
      });
      buttons.push(button);
      jsmaf.root.children.push(button);
      buttonMarkers.push(null); // markers not used here

      var btnText;
      if (useImageText) {
        btnText = new Image({
          url: textImageBase + opt.imgKey + '.png',
          x: btnX + 20, y: btnY + 15, width: 200, height: 50
        });
      } else {
        btnText = new jsmaf.Text();
        btnText.text = opt.label;
        btnText.x = btnX + 30;
        btnText.y = btnY + 28;
        btnText.style = 'white';
      }
      buttonTexts.push(btnText);
      jsmaf.root.children.push(btnText);

      // Value display (toggle/cycle)
      if (opt.type === 'toggle') {
        var checkmark = new Image({
          url: currentConfig[opt.key] ? baseImg + 'check_small_on.png' : baseImg + 'check_small_off.png',
          x: btnX + 320, y: btnY + 20, width: 40, height: 40
        });
        valueTexts.push(checkmark);
        jsmaf.root.children.push(checkmark);
      } else {
        var valueLabel;
        if (opt.key === 'jb_behavior') {
          if (useImageText) {
            valueLabel = new Image({
              url: textImageBase + jbBehaviorImgKeys[currentConfig.jb_behavior] + '.png',
              x: btnX + 230, y: btnY + 15, width: 150, height: 50
            });
          } else {
            valueLabel = new jsmaf.Text();
            valueLabel.text = jbBehaviorLabels[currentConfig.jb_behavior];
            valueLabel.x = btnX + 250;
            valueLabel.y = btnY + 28;
            valueLabel.style = 'white';
          }
        } else { // theme
          var themeIdx = availableThemes.indexOf(currentConfig.theme);
          if (themeIdx < 0) themeIdx = 0;
          if (useImageText) {
            valueLabel = new Image({
              url: textImageBase + themeImgKeys[themeIdx] + '.png',
              x: btnX + 230, y: btnY + 15, width: 150, height: 50
            });
          } else {
            valueLabel = new jsmaf.Text();
            valueLabel.text = themeLabels[themeIdx];
            valueLabel.x = btnX + 250;
            valueLabel.y = btnY + 28;
            valueLabel.style = 'white';
          }
        }
        valueTexts.push(valueLabel);
        jsmaf.root.children.push(valueLabel);
      }

      buttonOrigPos.push({ x: btnX, y: btnY });
      textOrigPos.push({ x: btnText.x, y: btnText.y });
    }

    // Back hint
    var backHint = new jsmaf.Text();
    backHint.text = jsmaf.circleIsAdvanceButton ? 'X to go back' : 'O to go back';
    backHint.x = centerX - 60;
    backHint.y = startY + configOptions.length * buttonSpacing + 120;
    backHint.style = 'white';
    jsmaf.root.children.push(backHint);

    // Animation state
    var zoomInInterval = null;
    var zoomOutInterval = null;
    var prevButton = -1;

    function easeInOut(t) {
      return (1 - Math.cos(t * Math.PI)) / 2;
    }

    function animateZoomIn(btn, text, btnOrigX, btnOrigY, textOrigX, textOrigY) {
      if (zoomInInterval) jsmaf.clearInterval(zoomInInterval);
      var btnW = buttonWidth;
      var btnH = buttonHeight;
      var startScale = btn.scaleX || 1.0;
      var endScale = 1.1;
      var duration = 175;
      var elapsed = 0;
      var step = 16;
      zoomInInterval = jsmaf.setInterval(function () {
        elapsed += step;
        var t = Math.min(elapsed / duration, 1);
        var eased = easeInOut(t);
        var scale = startScale + (endScale - startScale) * eased;
        btn.scaleX = scale;
        btn.scaleY = scale;
        btn.x = btnOrigX - btnW * (scale - 1) / 2;
        btn.y = btnOrigY - btnH * (scale - 1) / 2;
        text.scaleX = scale;
        text.scaleY = scale;
        text.x = textOrigX - btnW * (scale - 1) / 2;
        text.y = textOrigY - btnH * (scale - 1) / 2;
        if (t >= 1) {
          jsmaf.clearInterval(zoomInInterval);
          zoomInInterval = null;
        }
      }, step);
    }

    function animateZoomOut(btn, text, btnOrigX, btnOrigY, textOrigX, textOrigY) {
      if (zoomOutInterval) jsmaf.clearInterval(zoomOutInterval);
      var btnW = buttonWidth;
      var btnH = buttonHeight;
      var startScale = btn.scaleX || 1.1;
      var endScale = 1.0;
      var duration = 175;
      var elapsed = 0;
      var step = 16;
      zoomOutInterval = jsmaf.setInterval(function () {
        elapsed += step;
        var t = Math.min(elapsed / duration, 1);
        var eased = easeInOut(t);
        var scale = startScale + (endScale - startScale) * eased;
        btn.scaleX = scale;
        btn.scaleY = scale;
        btn.x = btnOrigX - btnW * (scale - 1) / 2;
        btn.y = btnOrigY - btnH * (scale - 1) / 2;
        text.scaleX = scale;
        text.scaleY = scale;
        text.x = textOrigX - btnW * (scale - 1) / 2;
        text.y = textOrigY - btnH * (scale - 1) / 2;
        if (t >= 1) {
          jsmaf.clearInterval(zoomOutInterval);
          zoomOutInterval = null;
        }
      }, step);
    }

    function updateHighlight() {
      var prevBtn = buttons[prevButton];
      if (prevButton >= 0 && prevButton !== currentButton && prevBtn) {
        prevBtn.url = normalButtonImg;
        prevBtn.alpha = 0.7;
        prevBtn.borderColor = 'transparent';
        prevBtn.borderWidth = 0;
        if (prevBtn.__glowVisible) prevBtn.__glowVisible = false;
        animateZoomOut(prevBtn, buttonTexts[prevButton], buttonOrigPos[prevButton].x, buttonOrigPos[prevButton].y, textOrigPos[prevButton].x, textOrigPos[prevButton].y);
      }

      for (var i = 0; i < buttons.length; i++) {
        var btn = buttons[i];
        var txt = buttonTexts[i];
        var origBtn = buttonOrigPos[i];
        var origTxt = textOrigPos[i];
        if (!btn || !txt) continue;

        if (i === currentButton) {
          btn.url = selectedButtonImg;
          btn.alpha = 1.0;
          btn.borderColor = 'rgb(100,180,255)';
          btn.borderWidth = 3;
          btn.__glowVisible = true;
          animateZoomIn(btn, txt, origBtn.x, origBtn.y, origTxt.x, origTxt.y);
        } else if (i !== prevButton) {
          btn.url = normalButtonImg;
          btn.alpha = 0.7;
          btn.borderColor = 'transparent';
          btn.borderWidth = 0;
          btn.__glowVisible = false;
          btn.scaleX = 1.0; btn.scaleY = 1.0;
          btn.x = origBtn.x; btn.y = origBtn.y;
          txt.scaleX = 1.0; txt.scaleY = 1.0;
          txt.x = origTxt.x; txt.y = origTxt.y;
        }
      }
      prevButton = currentButton;
    }

    function updateValueText(index) {
      var opt = configOptions[index];
      var val = valueTexts[index];
      if (!opt || !val) return;

      if (opt.type === 'toggle') {
        val.url = currentConfig[opt.key] ? baseImg + 'check_small_on.png' : baseImg + 'check_small_off.png';
      } else {
        if (opt.key === 'jb_behavior') {
          if (useImageText) {
            val.url = textImageBase + jbBehaviorImgKeys[currentConfig.jb_behavior] + '.png';
          } else {
            val.text = jbBehaviorLabels[currentConfig.jb_behavior];
          }
        } else if (opt.key === 'theme') {
          var idx = availableThemes.indexOf(currentConfig.theme);
          if (idx < 0) idx = 0;
          if (useImageText) {
            val.url = textImageBase + themeImgKeys[idx] + '.png';
          } else {
            val.text = themeLabels[idx];
          }
        }
      }
    }

    function saveConfig() {
      if (!configLoaded) return;
      var configData = {
        config: {
          autolapse: currentConfig.autolapse,
          autopoop: currentConfig.autopoop,
          autoclose: currentConfig.autoclose,
          autoclose_delay: currentConfig.autoclose_delay,
          music: currentConfig.music,
          jb_behavior: currentConfig.jb_behavior,
          theme: currentConfig.theme
        },
        payloads: userPayloads
      };
      fs.write('config.json', JSON.stringify(configData, null, 2), function (err) {
        if (err) log('ERROR saving config: ' + err.message);
        else log('Config saved');
      });
    }

    function loadConfig() {
      fs.read('config.json', function (err, data) {
        if (err) { log('No saved config, using defaults'); configLoaded = true; return; }
        try {
          var cfg = JSON.parse(data || '{}');
          if (cfg.config) {
            currentConfig.autolapse = cfg.config.autolapse || false;
            currentConfig.autopoop = cfg.config.autopoop || false;
            currentConfig.autoclose = cfg.config.autoclose || false;
            currentConfig.autoclose_delay = cfg.config.autoclose_delay || 0;
            currentConfig.music = cfg.config.music !== false;
            currentConfig.jb_behavior = cfg.config.jb_behavior || 0;
            if (cfg.config.theme && availableThemes.includes(cfg.config.theme)) {
              currentConfig.theme = cfg.config.theme;
            }
            if (cfg.payloads) userPayloads = cfg.payloads;
          }
          for (var i = 0; i < configOptions.length; i++) updateValueText(i);
          if (currentConfig.music) startBgmIfEnabled(); else stopBgm();
          configLoaded = true;
          log('Config loaded');
        } catch (e) {
          log('Error parsing config: ' + e.message);
          configLoaded = true;
        }
      });
    }

    function handleButtonPress() {
      if (currentButton >= configOptions.length) return;
      var opt = configOptions[currentButton];
      var key = opt.key;

      if (opt.type === 'cycle') {
        if (key === 'jb_behavior') {
          currentConfig.jb_behavior = (currentConfig.jb_behavior + 1) % jbBehaviorLabels.length;
        } else if (key === 'theme') {
          var idx = availableThemes.indexOf(currentConfig.theme);
          idx = (idx + 1) % availableThemes.length;
          currentConfig.theme = availableThemes[idx];
        }
      } else {
        currentConfig[key] = !currentConfig[key];
        if (key === 'music') {
          if (currentConfig.music) startBgmIfEnabled(); else stopBgm();
        }
        // Mutual exclusivity
        if (key === 'autolapse' && currentConfig.autolapse) {
          currentConfig.autopoop = false;
          updateValueText(configOptions.findIndex(o => o.key === 'autopoop'));
        } else if (key === 'autopoop' && currentConfig.autopoop) {
          currentConfig.autolapse = false;
          updateValueText(configOptions.findIndex(o => o.key === 'autolapse'));
        }
      }
      updateValueText(currentButton);
      saveConfig();
    }

    // Keyboard / gamepad simulation
    var confirmKey = jsmaf.circleIsAdvanceButton ? 13 : 14; // Enter or O?
    var backKey = jsmaf.circleIsAdvanceButton ? 14 : 13;

    jsmaf.onKeyDown = function (keyCode) {
      // D-pad right (6 or 5) = next
      if (keyCode === 6 || keyCode === 5) {
        currentButton = (currentButton + 1) % buttons.length;
        updateHighlight();
      }
      // D-pad left (4 or 7) = previous
      else if (keyCode === 4 || keyCode === 7) {
        currentButton = (currentButton - 1 + buttons.length) % buttons.length;
        updateHighlight();
      }
      // Confirm
      else if (keyCode === confirmKey) {
        handleButtonPress();
      }
      // Back -> return to main menu (navigate to index.html)
      else if (keyCode === backKey) {
        saveConfig();
        navigateTo('index.html'); // or wherever main menu is
      }
    };

    // Touch/keyboard fallback: map keyboard arrows
    window.addEventListener('keydown', function(e) {
      var key = e.key;
      if (key === 'ArrowDown') jsmaf.onKeyDown(6);
      else if (key === 'ArrowUp') jsmaf.onKeyDown(4);
      else if (key === 'Enter') jsmaf.onKeyDown(confirmKey);
      else if (key === 'Escape') jsmaf.onKeyDown(backKey);
      else if (key === 'ArrowRight') jsmaf.onKeyDown(5);
      else if (key === 'ArrowLeft') jsmaf.onKeyDown(7);
      e.preventDefault();
    });

    // Initialize
    updateScale();
    updateHighlight();
    loadConfig();
    log('Config menu ready');
  })();
  </script>
</body>
</html>
